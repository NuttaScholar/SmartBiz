# Standalone home LAN deployment. See deploy/home/README.md.
name: smartbiz-home

services:
  mongo-keyfile-init:
    image: alpine:3.20
    restart: 'no'
    command:
      - sh
      - '-c'
      - |
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/mongo-keyfile
        fi
        chown 999:999 /keyfile/mongo-keyfile
        chmod 400 /keyfile/mongo-keyfile
    volumes:
      - mongo-keyfile:/keyfile
  mongo:
    image: mongo:${MONGO_VERSION:-8.0.5}
    restart: always
    command:
      - mongod
      - '--replSet'
      - rs0
      - '--bind_ip_all'
      - '--keyFile'
      - /run/mongo-keyfile/mongo-keyfile
    networks:
      - private
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/run/mongo-keyfile:ro
      - ./deploy/${MONGO_DEPLOY_DIR:-mongodb-8.0}/mongo-health.js:/opt/mongo-health.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in deployment env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in deployment env}
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - ${MONGO_SHELL:-mongosh}
        - '--quiet'
        - '--nodb'
        - /opt/mongo-health.js
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-replica-init:
    image: mongo:${MONGO_VERSION:-8.0.5}
    restart: 'no'
    networks:
      - private
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - ${MONGO_SHELL:-mongosh}
      - '--quiet'
      - '--nodb'
      - /opt/mongo-replica-init.js
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in deployment env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in deployment env}
    volumes:
      - ./deploy/${MONGO_DEPLOY_DIR:-mongodb-8.0}/mongo-replica-init.js:/opt/mongo-replica-init.js:ro
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    restart: always
    ports:
      - 127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081
    networks:
      - private
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in deployment env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in deployment env}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:?Set MONGO_EXPRESS_USERNAME in deployment env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in deployment env}
    profiles:
      - admin
    depends_on:
      mongo:
        condition: service_healthy
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set MINIO_USER in deployment env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in deployment env}
      MINIO_SITE_REGION: us-east-1
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://127.0.0.1:9000/minio/health/ready
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private
    expose:
      - '9000'
    restart: unless-stopped
  service_account:
    build: ./ServerService/Service_Account
    image: nuttascholar/smartbiz_account:2.5
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?Set SERVICE_AUTH_SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080},http://${HOME_HOST}:${HOME_SHOP_PORT:-8082}
      PORT: 3000
      DB_URL: mongodb://smartbiz_account:${MONGO_ACCOUNT_PASSWORD:?Set MONGO_ACCOUNT_PASSWORD in deployment env}@mongo:27017/Account?authSource=admin&replicaSet=rs0
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_USER: ${MINIO_USER:?Set MINIO_USER in deployment env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in deployment env}
      NODE_ENV: production
      ALLOW_HTTP_PUBLIC_URL: 'true'
      MINIO_PUBLIC_URL: http://${HOME_HOST}:${HOME_MEDIA_PORT:-9000}
    networks:
      - private
    expose:
      - '3000'
    depends_on:
      mongo-users-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3000/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  service_login:
    build: ./ServerService/Service_Login
    image: nuttascholar/smartbiz_login:1.3
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080}
      PORT: 3001
      DB_URL: mongodb://smartbiz_login:${MONGO_LOGIN_PASSWORD:?Set MONGO_LOGIN_PASSWORD in deployment env}@mongo:27017/User?authSource=admin&replicaSet=rs0
      NODE_ENV: production
      COOKIE_SECURE: 'false'
    networks:
      - private
    expose:
      - '3001'
    depends_on:
      mongo-users-init:
        condition: service_completed_successfully
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3001/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  service_stock:
    build: ./ServerService/Service_Stock
    image: nuttascholar/smartbiz_stock:1.5
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?Set SERVICE_AUTH_SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080}
      PORT: 3003
      DB_URL: mongodb://smartbiz_stock:${MONGO_STOCK_PASSWORD:?Set MONGO_STOCK_PASSWORD in deployment env}@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_USER: ${MINIO_USER:?Set MINIO_USER in deployment env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in deployment env}
      SERVICE_ACCOUNT_URL: http://service_account:3000
      SERVICE_BILL_URL: http://service_bill:3004
      TZ: Asia/Bangkok
      NODE_ENV: production
      ALLOW_HTTP_PUBLIC_URL: 'true'
      MINIO_PUBLIC_URL: http://${HOME_HOST}:${HOME_MEDIA_PORT:-9000}
    networks:
      - private
    expose:
      - '3003'
    depends_on:
      mongo-users-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3003/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  service_bill:
    build: ./ServerService/Service_Bill
    image: nuttascholar/smartbiz_bill:1.4
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?Set SERVICE_AUTH_SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080}
      PORT: 3004
      CANCELLED_ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS:-2592000}
      MONGO_URI_ACCOUNT: mongodb://smartbiz_bill:${MONGO_BILL_PASSWORD:?Set MONGO_BILL_PASSWORD in deployment env}@mongo:27017/Account?authSource=admin&replicaSet=rs0
      MONGO_URI_BILL: mongodb://smartbiz_bill:${MONGO_BILL_PASSWORD:?Set MONGO_BILL_PASSWORD in deployment env}@mongo:27017/Bill?authSource=admin&replicaSet=rs0
      MONGO_URI_STOCK: mongodb://smartbiz_bill:${MONGO_BILL_PASSWORD:?Set MONGO_BILL_PASSWORD in deployment env}@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      SERVICE_ACCOUNT_URL: http://service_account:3000
      SERVICE_STOCK_URL: http://service_stock:3003
      TZ: Asia/Bangkok
      NODE_ENV: production
      ALLOW_HTTP_PUBLIC_URL: 'true'
      MINIO_PUBLIC_URL: http://${HOME_HOST}:${HOME_MEDIA_PORT:-9000}
    networks:
      - private
    expose:
      - '3004'
    depends_on:
      mongo-users-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      service_stock:
        condition: service_healthy
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3004/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  service_storage:
    build: ./ServerService/Service_Storage
    image: nuttascholar/smartbiz_storage:1.3
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?Set SERVICE_AUTH_SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080}
      PORT: 3002
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_USER: ${MINIO_USER:?Set MINIO_USER in deployment env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in deployment env}
      NODE_ENV: production
      ALLOW_HTTP_PUBLIC_URL: 'true'
      MINIO_PUBLIC_URL: http://${HOME_HOST}:${HOME_MEDIA_PORT:-9000}
    networks:
      - private
    expose:
      - '3002'
    depends_on:
      minio:
        condition: service_healthy
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3002/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  service_storefront:
    build: ./ServerService/Service_StoreFront
    image: nuttascholar/smartbiz_storefront:1.2
    environment:
      SECRET: ${SECRET:?Set SECRET in deployment env}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?Set SERVICE_AUTH_SECRET in deployment env}
      WEB_HOSTS: http://${HOME_HOST:?Set HOME_HOST in .env.home}:${HOME_ADMIN_PORT:-8080},http://${HOME_HOST}:${HOME_SHOP_PORT:-8082}
      PORT: 3005
      MONGO_URI_ACCOUNT: mongodb://smartbiz_storefront:${MONGO_STOREFRONT_PASSWORD:?Set MONGO_STOREFRONT_PASSWORD in deployment env}@mongo:27017/Account?authSource=admin&replicaSet=rs0
      MONGO_URI_BILL: mongodb://smartbiz_storefront:${MONGO_STOREFRONT_PASSWORD:?Set MONGO_STOREFRONT_PASSWORD in deployment env}@mongo:27017/Bill?authSource=admin&replicaSet=rs0
      MONGO_URI_STOCK: mongodb://smartbiz_storefront:${MONGO_STOREFRONT_PASSWORD:?Set MONGO_STOREFRONT_PASSWORD in deployment env}@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      MONGO_URI_STOREFRONT: mongodb://smartbiz_storefront:${MONGO_STOREFRONT_PASSWORD:?Set MONGO_STOREFRONT_PASSWORD in deployment env}@mongo:27017/StoreFront?authSource=admin&replicaSet=rs0
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_USER: ${MINIO_USER:?Set MINIO_USER in deployment env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in deployment env}
      PAYMENT_EVIDENCE_BUCKET: storefront-payment
      SERVICE_BILL_URL: http://service_bill:3004
      TZ: Asia/Bangkok
      NODE_ENV: production
      ALLOW_HTTP_PUBLIC_URL: 'true'
      MINIO_PUBLIC_URL: http://${HOME_HOST}:${HOME_MEDIA_PORT:-9000}
    networks:
      - private
    expose:
      - '3005'
    depends_on:
      mongo-users-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      service_bill:
        condition: service_healthy
    pull_policy: never
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3005/readyz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  web_gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/home/templates:/etc/nginx/templates:ro
      - ./dist-home:/usr/share/nginx/html:ro
      - ./deploy/home/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${HOME_BIND_IP:-0.0.0.0}:${HOME_ADMIN_PORT:-8080}:8080'
      - '${HOME_BIND_IP:-0.0.0.0}:${HOME_SHOP_PORT:-8082}:8082'
      - '${HOME_BIND_IP:-0.0.0.0}:${HOME_MEDIA_PORT:-9000}:9000'
    networks:
      - private
    depends_on:
      service_account:
        condition: service_healthy
      service_login:
        condition: service_healthy
      service_stock:
        condition: service_healthy
      service_bill:
        condition: service_healthy
      service_storage:
        condition: service_healthy
      service_storefront:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://127.0.0.1:8080/gateway/health
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    expose:
      - '8080'
      - '8082'
      - '9000'
  mongo-users-init:
    image: mongo:${MONGO_VERSION:-8.0.5}
    restart: 'no'
    networks:
      - private
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in deployment env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in deployment env}
      MONGO_ACCOUNT_PASSWORD: ${MONGO_ACCOUNT_PASSWORD:?Set MONGO_ACCOUNT_PASSWORD in deployment env}
      MONGO_LOGIN_PASSWORD: ${MONGO_LOGIN_PASSWORD:?Set MONGO_LOGIN_PASSWORD in deployment env}
      MONGO_STOCK_PASSWORD: ${MONGO_STOCK_PASSWORD:?Set MONGO_STOCK_PASSWORD in deployment env}
      MONGO_BILL_PASSWORD: ${MONGO_BILL_PASSWORD:?Set MONGO_BILL_PASSWORD in deployment env}
      MONGO_STOREFRONT_PASSWORD: ${MONGO_STOREFRONT_PASSWORD:?Set MONGO_STOREFRONT_PASSWORD in deployment env}
    volumes:
      - ./deploy/${MONGO_DEPLOY_DIR:-mongodb-8.0}/mongo-users.js:/opt/mongo-users.js:ro
    entrypoint:
      - ${MONGO_SHELL:-mongosh}
      - '--quiet'
      - '--nodb'
      - /opt/mongo-users.js
networks:
  private:
    driver: bridge
volumes:
  mongo-data: {}
  mongo-keyfile: {}
  minio-data: {}
