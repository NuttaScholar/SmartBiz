upstream account_api { server service_account:3000; }
upstream login_api { server service_login:3001; }
upstream storage_api { server service_storage:3002; }
upstream stock_api { server service_stock:3003; }
upstream bill_api { server service_bill:3004; }
upstream storefront_api { server service_storefront:3005; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;

    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"development-api-gateway"}';
    }

    location = /api/login      { return 308 /api/login/; }
    location = /api/account    { return 308 /api/account/; }
    location = /api/storage    { return 308 /api/storage/; }
    location = /api/stock      { return 308 /api/stock/; }
    location = /api/bill       { return 308 /api/bill/; }
    location = /api/storefront { return 308 /api/storefront/; }

    location ^~ /api/login/      { proxy_pass http://login_api/; }
    location ^~ /api/account/    { proxy_pass http://account_api/; }
    location ^~ /api/storage/    { proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://storage_api/; }
    location ^~ /api/stock/      { proxy_pass http://stock_api/; }
    location ^~ /api/bill/       { proxy_pass http://bill_api/; }
    location ^~ /api/storefront/ { proxy_pass http://storefront_api/; }

    location / {
        default_type application/json;
        return 404 '{"error":"Development API route not found"}';
    }
}
