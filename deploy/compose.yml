services:
  mongo:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - smartbiz-private

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongo
    networks:
      - smartbiz-private

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${VITE_PORT_MINIO}:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartbiz-private

  service_account:
    image: ${ACCOUNT_IMAGE}
    restart: always
    environment:
      SECRET: ${SECRET}
      WEB_HOST: http://${VITE_HOST}:${VITE_PORT}
      PORT: 3000
      DB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/Account?authSource=admin
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "${VITE_PORT_ACCESS}:3000"
    depends_on:
      - mongo
      - minio
    networks:
      - smartbiz-private

  service_login:
    image: ${LOGIN_IMAGE}
    restart: always
    environment:
      SECRET: ${SECRET}
      WEB_HOST: http://${VITE_HOST}:${VITE_PORT}
      PORT: 3001
      DB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/User?authSource=admin
    ports:
      - "${VITE_PORT_LOGIN}:3001"
    depends_on:
      - mongo
    networks:
      - smartbiz-private

  service_storage:
    image: ${STORAGE_IMAGE}
    restart: always
    environment:
      SECRET: ${SECRET}
      WEB_HOST: http://${VITE_HOST}:${VITE_PORT}
      PORT: 3002
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "${VITE_PORT_STORE}:3002"
    depends_on:
      - minio
    networks:
      - smartbiz-private

  service_stock:
    image: ${STOCK_IMAGE}
    restart: always
    environment:
      SECRET: ${SECRET}
      WEB_HOST: http://${VITE_HOST}:${VITE_PORT}
      PORT: 3003
      DB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/Stock?authSource=admin
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      SERVICE_ACCOUNT_URL: http://service_account:3000
      SERVICE_BILL_URL: http://service_bill:3004
      TZ: Asia/Bangkok
    ports:
      - "${VITE_PORT_STOCK}:3003"
    depends_on:
      - mongo
      - minio
      - service_account
    networks:
      - smartbiz-private

  service_bill:
    image: ${BILL_IMAGE}
    restart: always
    environment:
      SECRET: ${SECRET}
      WEB_HOST: http://${VITE_HOST}:${VITE_PORT}
      PORT: 3004
      MONGO_URI_ACCOUNT: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/Account?authSource=admin
      MONGO_URI_BILL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/Bill?authSource=admin
      MONGO_URI_STOCK: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/Stock?authSource=admin
      SERVICE_ACCOUNT_URL: http://service_account:3000
      TZ: Asia/Bangkok
    ports:
      - "${VITE_PORT_BILL}:3004"
    depends_on:
      - mongo
      - service_account
    networks:
      - smartbiz-private

  web:
    image: ${WEB_IMAGE}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_HOST: ${VITE_HOST}
        VITE_PORT_ACCESS: ${VITE_PORT_ACCESS}
        VITE_PORT_LOGIN: ${VITE_PORT_LOGIN}
        VITE_PORT_STORE: ${VITE_PORT_STORE}
        VITE_PORT_STOCK: ${VITE_PORT_STOCK}
        VITE_PORT_BILL: ${VITE_PORT_BILL}
        VITE_PORT_MINIO: ${VITE_PORT_MINIO}
    restart: always
    environment:
      NGINX_PORT: 80
    ports:
      - "${VITE_PORT}:80"
    depends_on:
      - service_account
      - service_login
      - service_storage
      - service_stock
      - service_bill
    networks:
      - smartbiz-private

networks:
  smartbiz-private:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
