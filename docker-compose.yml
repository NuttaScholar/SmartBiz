services:
  mongo-keyfile-init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/mongo-keyfile
        fi
        chown 999:999 /keyfile/mongo-keyfile
        chmod 400 /keyfile/mongo-keyfile
    volumes:
      - mongo-keyfile:/keyfile

  mongo:
    container_name: database
    # The current mongo-data volume is MongoDB 8.0/FCV 8.0. Set
    # MONGO_VERSION=4.4 only when using a MongoDB 4.4-compatible data volume.
    image: mongo:${MONGO_VERSION:-8.0.5}
    restart: always
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /run/mongo-keyfile/mongo-keyfile
    networks:
      private:
        ipv4_address: 192.168.110.80
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/run/mongo-keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "MONGO_SHELL=$$(command -v mongosh || command -v mongo) && $$MONGO_SHELL --quiet --username root --password example --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'"
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-replica-init:
    image: mongo:${MONGO_VERSION:-8.0.5}
    restart: "no"
    networks:
      - private
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        MONGO_SHELL=$$(command -v mongosh || command -v mongo)
        $$MONGO_SHELL --host mongo:27017 --quiet \
          --username root --password example --authenticationDatabase admin \
          --eval 'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'
        for attempt in {1..30}; do
          if $$MONGO_SHELL --host mongo:27017 --quiet \
            --username root --password example --authenticationDatabase admin \
            --eval 'db.isMaster().ismaster' | grep -q true; then
            exit 0
          fi
          sleep 1
        done
        exit 1

  mongo-express:
    container_name: web_database
    image: mongo-express
    restart: always
    ports:
      - ${MONGO_EXPRESS_PORT}:8081
    networks:
      private:
        ipv4_address: 192.168.110.81
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin&replicaSet=rs0
      ME_CONFIG_BASICAUTH: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - ${VITE_PORT_MINIO}:9000 # API
      - ${MINIO_CONSOLE_PORT}:9001 # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://host.docker.internal:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      private:
        ipv4_address: 192.168.110.82

  service_account:
    container_name: service_account
    image: nuttascholar/smartbiz_account:2.4
    environment:
      SECRET: ${SECRET}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND},${VITE_WEB_SHOP}"
      PORT: 3000
      DB_URL: mongodb://root:example@mongo:27017/Account?authSource=admin&replicaSet=rs0
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${VITE_PORT_MINIO}
      MINIO_USE_SSL: false
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    networks:
      private:
        ipv4_address: 192.168.110.90
    ports:
      - ${VITE_PORT_ACCESS}:3000
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  service_login:
    container_name: service_login
    image: nuttascholar/smartbiz_login:1.2
    environment:
      SECRET: ${SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND}"
      PORT: 3001
      DB_URL: mongodb://root:example@mongo:27017/User?authSource=admin&replicaSet=rs0
    networks:
      private:
        ipv4_address: 192.168.110.91
    ports:
      - ${VITE_PORT_LOGIN}:3001
    depends_on:
      - mongo

  service_stock:
    container_name: service_stock
    image: nuttascholar/smartbiz_stock:1.4
    environment:
      SECRET: ${SECRET}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND}"
      PORT: 3003
      DB_URL: mongodb://root:example@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${VITE_PORT_MINIO}
      MINIO_USE_SSL: false
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      SERVICE_ACCOUNT_URL: http://service_account:3000
      SERVICE_BILL_URL: http://service_bill:3004
      TZ: Asia/Bangkok
    networks:
      private:
        ipv4_address: 192.168.110.93
    ports:
      - ${VITE_PORT_STOCK}:3003
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  service_bill:
    container_name: service_bill
    image: nuttascholar/smartbiz_bill:1.3
    environment:
      SECRET: ${SECRET}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND}"
      PORT: 3004
      CANCELLED_ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS} 
      MONGO_URI_ACCOUNT: mongodb://root:example@mongo:27017/Account?authSource=admin&replicaSet=rs0
      MONGO_URI_BILL: mongodb://root:example@mongo:27017/Bill?authSource=admin&replicaSet=rs0
      MONGO_URI_STOCK: mongodb://root:example@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${VITE_PORT_MINIO}
      MINIO_USE_SSL: false
      SERVICE_ACCOUNT_URL: http://service_account:3000
      SERVICE_STOCK_URL: http://service_stock:3003
      TZ: Asia/Bangkok
    networks:
      private:
        ipv4_address: 192.168.110.94
    ports:
      - ${VITE_PORT_BILL}:3004
    depends_on:
      - mongo
      - service_stock

  service_storage:
    container_name: service_storage
    image: nuttascholar/smartbiz_storage:1.2
    environment:
      SECRET: ${SECRET}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND}"
      PORT: 3002
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${VITE_PORT_MINIO}
      MINIO_USE_SSL: false
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}      
    networks:
      private:
        ipv4_address: 192.168.110.92
    ports:
      - ${VITE_PORT_STORE}:3002
    depends_on:
      - minio

  service_storefront:
    container_name: service_storefront
    image: nuttascholar/smartbiz_storefront:1.1
    environment:
      SECRET: ${SECRET}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET}
      WEB_HOSTS: "${VITE_WEB_BACKEND},${VITE_WEB_SHOP}"
      PORT: 3005
      MONGO_URI_ACCOUNT: mongodb://root:example@mongo:27017/Account?authSource=admin&replicaSet=rs0
      MONGO_URI_BILL: mongodb://root:example@mongo:27017/Bill?authSource=admin&replicaSet=rs0
      MONGO_URI_STOCK: mongodb://root:example@mongo:27017/Stock?authSource=admin&replicaSet=rs0
      MONGO_URI_STOREFRONT: mongodb://root:example@mongo:27017/StoreFront?authSource=admin&replicaSet=rs0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${VITE_PORT_MINIO}
      MINIO_USE_SSL: false
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      PAYMENT_EVIDENCE_BUCKET: storefront-payment
      SERVICE_BILL_URL: http://service_bill:3004
      TZ: Asia/Bangkok
    networks:
      private:
        ipv4_address: 192.168.110.95
    ports:
      - ${VITE_PORT_STOREFRONT}:3005
    depends_on:
      - mongo
      - minio
      - service_bill

  web:
    container_name: web
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 3031:80
    environment:
      NGINX_PORT: 80
    networks:
      - private
    depends_on:
      - service_account
      - service_login
      - service_storage
      - service_stock
      - service_bill
      - service_storefront
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/gateway/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  private:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.110.0/24

volumes:
  mongo-data: {}
  mongo-keyfile: {}
  minio-data: {}
